# Release pipeline for the NInfer V100 (sm_70) build.
#
# Triggers:
#   - push a tag:        git tag v1.6.0 && git push origin v1.6.0
#   - manual dispatch:   Actions -> release -> Run workflow -> version v1.6.0
#
# Outputs:
#   - GitHub Release with Linux tarballs (server + CLI + perplexity, sm_70)
#   - the V100 container image, ghcr.io/<owner>/<repo>:<version>-sm70 and :sm70 (Dockerfile.sm70)
#
# The image job is separate from the release job: if the registry refuses the push the tarballs still
# publish, and re-running this workflow fills the image in.
#
# The release body is RELEASE_NOTES_<version>.md from the tagged commit, so the published text and
# the notes in the tree cannot drift apart. GitHub-hosted runners have no GPU; the build is
# compile-only and the smoke step tolerates binaries that insist on a GPU even for --help.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.6.0)'
        required: true
        type: string

env:
  CUDA_APT_VERSION: '12-8'
  CUDA_HOME: /usr/local/cuda-12.8
  CUTLASS_VERSION: '4.4.2'

jobs:
  build:
    name: Build Linux binaries (sm_70)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    outputs:
      version: ${{ steps.meta.outputs.version }}
      notes: ${{ steps.meta.outputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version and check the notes
        id: meta
        run: |
          version="${{ inputs.version || github.ref_name }}"
          notes="RELEASE_NOTES_${version#v}.md"
          if [[ ! -f "$notes" ]]; then
            echo "::error::$notes is missing: write the release notes before tagging $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"
          echo "Release $version, body from $notes"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config ccache curl ca-certificates \
            libcurl4-openssl-dev libavformat-dev libavcodec-dev libavutil-dev libswscale-dev

      - name: Install CUDA 12.8 toolkit (nvcc + dev libs, no driver)
        run: |
          curl -fLO https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cuda-nvcc-${{ env.CUDA_APT_VERSION }} \
            cuda-cudart-dev-${{ env.CUDA_APT_VERSION }} \
            cuda-nvtx-${{ env.CUDA_APT_VERSION }} \
            cuda-driver-dev-${{ env.CUDA_APT_VERSION }} \
            libcublas-dev-${{ env.CUDA_APT_VERSION }}
          echo "$CUDA_HOME/bin" >> "$GITHUB_PATH"
          "$CUDA_HOME/bin/nvcc" --version

      - name: Cache CUTLASS ${{ env.CUTLASS_VERSION }}
        uses: actions/cache@v4
        with:
          path: cutlass-${{ env.CUTLASS_VERSION }}
          key: cutlass-${{ env.CUTLASS_VERSION }}-v1

      - name: Fetch CUTLASS ${{ env.CUTLASS_VERSION }}
        run: |
          if [ ! -f "cutlass-${{ env.CUTLASS_VERSION }}/CMakeLists.txt" ]; then
            curl -fL "https://github.com/NVIDIA/cutlass/archive/refs/tags/v${{ env.CUTLASS_VERSION }}.tar.gz" | tar xz
          fi
          test -f "cutlass-${{ env.CUTLASS_VERSION }}/CMakeLists.txt"

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-sm70-${{ github.sha }}
          restore-keys: ccache-sm70-

      # sm_70 only, explicit CUDA 12.8 nvcc, local CUTLASS via FETCHCONTENT_SOURCE_DIR_CUTLASS.
      - name: Configure (sm_70 only)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CUDA_ARCHITECTURES=70 \
            -DCMAKE_CUDA_COMPILER="$CUDA_HOME/bin/nvcc" \
            -DNINFER_BUILD_APPS=ON \
            -DBUILD_TESTING=OFF \
            -DNINFER_BUILD_BENCHMARKS=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CUDA_COMPILER_LAUNCHER=ccache \
            -DFETCHCONTENT_SOURCE_DIR_CUTLASS="$PWD/cutlass-${{ env.CUTLASS_VERSION }}"

      - name: Build
        run: |
          export CCACHE_DIR="$PWD/.ccache"
          cmake --build build -j"$(nproc)"
          ccache --show-stats || true

      - name: Smoke check (no GPU on CI)
        run: |
          set -euo pipefail
          for b in ninfer ninfer-serve ninfer-perplexity; do
            file "build/apps/$b"
            # libcuda.so.1 is the driver library injected at runtime on GPU hosts (and by
            # nvidia-container-toolkit); it is always absent on CI.
            if ldd "build/apps/$b" | grep "not found" | grep -vq "libcuda.so.1"; then
              ldd "build/apps/$b" | grep "not found"
              echo "::error::unresolved shared libraries in $b"
              exit 1
            fi
          done
          ./build/apps/ninfer --help >/dev/null 2>&1 \
            && echo "ninfer --help OK" \
            || echo "::warning::ninfer --help exits nonzero without a GPU (tolerated)"
          ./build/apps/ninfer-serve --help >/dev/null 2>&1 \
            && echo "ninfer-serve --help OK" \
            || echo "::warning::ninfer-serve --help exits nonzero without a GPU (tolerated)"

      - name: Package release tarballs
        run: |
          set -euo pipefail
          V="${{ steps.meta.outputs.version }}"
          cd build/apps
          for b in ninfer ninfer-serve ninfer-perplexity; do strip "$b"; done
          cd "$GITHUB_WORKSPACE"

          # Full bundle: the three programs plus the license and the V100 notes.
          PKG="ninfer-v100-${V}-linux-x86_64-sm70"
          mkdir -p "dist/$PKG/bin"
          cp build/apps/ninfer build/apps/ninfer-serve build/apps/ninfer-perplexity "dist/$PKG/bin/"
          cp README.md LICENSE "RELEASE_NOTES_${V#v}.md" "dist/$PKG/"
          tar czf "dist/$PKG.tar.gz" -C dist "$PKG"
          rm -rf "dist/$PKG"

          # Thin bundle: the server binary alone.
          mkdir -p dist/thin/bin
          cp build/apps/ninfer-serve dist/thin/bin/
          tar czf dist/ninfer-serve-sm70.tar.gz -C dist/thin bin
          rm -rf dist/thin

          cd dist
          sha256sum *.tar.gz > SHA256SUMS.txt
          ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: linux-tarballs
          path: dist/
          retention-days: 7

  image:
    name: Publish the V100 container image
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-tarballs
          path: dist

      # Dockerfile.sm70 copies the binary from its build context, so unpack it into its own.
      - name: Unpack the server binary
        run: |
          mkdir -p image
          tar xzf dist/ninfer-serve-sm70.tar.gz -C image --strip-components=1
          ls -l image

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `sm70` moves with each release the way `latest` does for the sm_86/sm_120a image. The pinned
      # tag drops the leading v, so 1.6.1-sm70 matches the release it came from.
      - name: Build and push
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="${{ needs.build.outputs.version }}"
          docker build -f Dockerfile.sm70 \
            -t "$image:${version#v}-sm70" \
            -t "$image:sm70" \
            image
          docker push "$image:${version#v}-sm70"
          docker push "$image:sm70"

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: linux-tarballs
          path: dist

      # The body is the release notes from the tagged tree; editing them in the repository and
      # re-running this workflow is how a published release gets corrected.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: NInfer V100 ${{ needs.build.outputs.version }}
          files: dist/*
          body_path: ${{ needs.build.outputs.notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
